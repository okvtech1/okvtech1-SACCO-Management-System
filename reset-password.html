<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — OKV SACCO Subscribe</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root{ --navy:#0D1B2A; --navy-2:#13293D; --teal:#1B6CA8; --teal-2:#22C7A9; --muted:#6B7C93; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:18px;padding:28px;max-width:400px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.3);}
  .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--teal-2),var(--teal));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:-.5px;margin-bottom:14px;}
  h1{font-size:18px;margin:0 0 4px;color:var(--navy);}
  p.sub{font-size:12.5px;color:var(--muted);margin:0 0 20px;}
  label{font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:4px;display:block;}
  input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #DCE3EE;margin-bottom:14px;font-size:14px;}
  .btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--teal-2);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  .btn:disabled{opacity:.55;}
  .err{background:#FDECEC;color:#B3261E;font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}
  .ok{background:#E7F8F3;color:#0C7A5E;font-size:12.5px;padding:14px;border-radius:10px;display:none;}
  .foot-link{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px;}
  .foot-link a{color:var(--teal);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo" id="brandMark">OKV</div>
    <img id="brandLogoImg" style="display:none;width:52px;height:52px;border-radius:14px;object-fit:cover;margin-bottom:14px;" alt="Logo">
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Checking your reset link…</p>

    <div class="err" id="errBox"></div>
    <div class="ok" id="okBox">
      <i class="bi bi-check-circle-fill"></i> Password updated. You can now <a href="login.html">sign in</a>.
    </div>

    <form id="resetForm" style="display:none;">
      <label>New Password</label>
      <input type="password" id="newPassword" minlength="6" required>
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" minlength="6" required>
      <button class="btn" type="submit" id="submitBtn">Update Password</button>
    </form>
    <div class="foot-link"><a href="login.html">Back to sign in</a></div>
    <div class="foot-link" style="margin-top:4px;"><a href="privacy-policy.html">Privacy</a> · <a href="terms-of-service.html">Terms</a></div>
  </div>

<script src="config.js"></script>
<script>
  loadPlatformSettings().then(applyBranding);
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const subText = document.getElementById("subText");
  const errBox = document.getElementById("errBox");
  const form = document.getElementById("resetForm");

  if(!token){
    subText.textContent = "This link is missing a reset token.";
    errBox.textContent = "Request a new reset link from the sign-in page.";
    errBox.style.display = "block";
  }else{
    subText.textContent = "Enter a new password for your account below.";
    form.style.display = "block";
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    errBox.style.display = "none";
    const p1 = document.getElementById("newPassword").value;
    const p2 = document.getElementById("confirmPassword").value;
    if(p1 !== p2){ errBox.textContent = "Passwords do not match."; errBox.style.display = "block"; return; }
    if(!navigator.onLine){ errBox.textContent = "Connect to the internet to reset your password."; errBox.style.display = "block"; return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Updating…";
    try{
      const newPasswordHash = await sha256(p1);
      await apiCall("resetPassword", { token, newPasswordHash });
      form.style.display = "none";
      document.getElementById("okBox").style.display = "block";
      subText.style.display = "none";
    }catch(err){
      errBox.textContent = err.message; errBox.style.display = "block";
    }finally{
      btn.disabled = false; btn.textContent = "Update Password";
    }
  });
</script>
</body>
</html>
